name: Deploy LOGISTIK-UNIKOM

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.4
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            cd /var/www/html/unikom-perlengkapan-backend-v2

            git fetch origin dev
            git reset --hard origin/dev

            composer install --no-dev --optimize-autoloader